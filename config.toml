baseURL = "https://maxhalford.github.io/"
locale = "en-US"
title = "Max Halford"
theme = "yinyang"
enableRobotsTXT = true
enableGitInfo = true
pygmentsUseClasses = true

[params.author]
  email = "maxhalford25@gmail.com"
  name = "Max Halford"

[params]
  headTitle = "Max Halford"
  mainSections = ["blog"]
  favicon = "/img/favicon.ico"
  images = ["/img/belle-ile.jpg"]
  description = "Max Halford's blog"

[params.social]
  twitter = "halford_max"

[markup.goldmark.renderer]
  unsafe = true

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[robots]
  llmsTXT = true

[security]
  allowContent = ['text/html', 'text/markdown', 'text/org', 'text/asciidoc', 'text/pandoc', 'text/rst']
