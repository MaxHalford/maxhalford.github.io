<script>
  // Theme selector (initial theme is set in head.html before paint)
  (function () {
    var toggle = document.getElementById("theme-toggle");
    if (!toggle) return;

    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var preferences = ["system", "light", "dark"];

    function applyTheme(preference, announce) {
      var resolved = preference === "system"
        ? (media.matches ? "dark" : "light")
        : preference;
      document.documentElement.setAttribute("data-theme-setting", preference);
      document.documentElement.setAttribute("data-theme", resolved);
      toggle.setAttribute("aria-label", "Theme: " + preference + ". Change theme");
      toggle.setAttribute("title", "Theme: " + preference);
      if (announce) {
        var status = toggle.querySelector(".visually-hidden");
        if (status) status.textContent = "Theme set to " + preference;
      }
    }

    var current = document.documentElement.getAttribute("data-theme-setting") || "system";
    applyTheme(current, false);

    toggle.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme-setting") || "system";
      var next = preferences[(preferences.indexOf(current) + 1) % preferences.length];
      applyTheme(next, true);
      try {
        if (next === "system") localStorage.removeItem("theme");
        else localStorage.setItem("theme", next);
      } catch (e) {}
    });

    function handleSystemThemeChange() {
      if (document.documentElement.getAttribute("data-theme-setting") === "system") {
        applyTheme("system", false);
      }
    }
    if (media.addEventListener) media.addEventListener("change", handleSystemThemeChange);
    else if (media.addListener) media.addListener(handleSystemThemeChange);
  })();
</script>

<script>
document.querySelectorAll("details.modal").forEach(details => {
  const summary = details.querySelector("summary");
  if (!summary) return;
  summary.addEventListener("click", (e) => {
    e.preventDefault();
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const inner = document.createElement("div");
    inner.className = "modal-overlay-content";
    const close = document.createElement("button");
    close.className = "modal-close";
    close.setAttribute("aria-label", "Close");
    close.innerHTML = "&times;";
    inner.appendChild(close);
    const header = document.createElement("div");
    header.className = "modal-overlay-header";
    header.innerHTML = summary.innerHTML;
    inner.appendChild(header);
    Array.from(details.childNodes).forEach(node => {
      if (node === summary) return;
      inner.appendChild(node.cloneNode(true));
    });
    overlay.appendChild(inner);
    document.body.appendChild(overlay);
    const previousOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const closeModal = () => {
      overlay.remove();
      document.body.style.overflow = previousOverflow;
      document.removeEventListener("keydown", onKey);
    };
    const onKey = (ev) => { if (ev.key === "Escape") closeModal(); };
    close.addEventListener("click", closeModal);
    overlay.addEventListener("click", (ev) => {
      if (ev.target === overlay) closeModal();
    });
    document.addEventListener("keydown", onKey);
  });
});
</script>

<script>
document.querySelectorAll("pre:not(.mermaid)").forEach(pre => {
  const button = document.createElement("button");
  button.className = "copy-button";
  button.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg>`;
  button.addEventListener("click", async () => {
    const code = pre.querySelector("code");
    const text = code ? code.innerText : pre.innerText;
    await navigator.clipboard.writeText(text);
    button.classList.add("copied");
    button.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path></svg>`;
    setTimeout(() => {
      button.classList.remove("copied");
      button.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg>`;
    }, 2000);
  });
  const wrapper = document.createElement("div");
  wrapper.className = "code-wrapper";
  pre.parentNode.insertBefore(wrapper, pre);
  wrapper.appendChild(pre);
  wrapper.appendChild(button);
});
</script>
