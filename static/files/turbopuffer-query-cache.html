  <script>
    function syncTheme() {
      let theme;
      try { theme = window.parent.document.documentElement.dataset.theme; } catch (_) {}
      if (!['light', 'dark'].includes(theme)) {
        try { theme = localStorage.getItem('theme'); } catch (_) {}
      }
      document.documentElement.dataset.theme = ['light', 'dark'].includes(theme) ? theme
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    syncTheme();
  </script>
  <style>
    :root { color-scheme: light; --bg:#fff; --fg:#333; --muted:#6a737d; --grid:#eaecef; --line:#8c959f; }
    html[data-theme="dark"] { color-scheme:dark; --bg:#0d1117; --fg:#c9d1d9; --muted:#8b949e; --grid:#21262d; --line:#484f58; }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); color:var(--fg); }
    body { font-family:ui-monospace,"SFMono-Regular","Cascadia Mono","Roboto Mono",monospace; font-variant-numeric:tabular-nums; }
    main { position:relative; max-width:1040px; margin:auto; padding:24px 18px 18px; }
    header { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(19px,3.2vw,31px); font-weight:650; letter-spacing:-.04em; }
    .meta { font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
    .legend { display:flex; flex-wrap:wrap; gap:10px 20px; font-size:12px; margin-bottom:12px; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .legend svg { width:16px; height:16px; overflow:visible; }
    figure { margin:0; }
    #plot > svg { display:block; width:100%; }
    text { fill:var(--fg); font-family:inherit; font-size:12px; }
    .tick text { fill:var(--muted); }
    .tick line,.domain { stroke:var(--line); }
    .grid line { stroke:var(--grid); stroke-dasharray:2 5; }
    .grid .domain { display:none; }
    .point { fill:var(--bg); stroke:var(--fg); stroke-width:1.3; opacity:.65; }
    .tooltip { position:absolute; display:none; z-index:2; padding:10px; border:1px solid var(--fg); background:var(--bg); color:var(--fg); pointer-events:none; font-size:11px; line-height:1.6; max-width:calc(100% - 20px); }
    .tooltip[data-visible="true"] { display:block; }
    .tooltip strong { font-weight:600; }
    figcaption { color:var(--muted); font-size:11px; line-height:1.6; margin-top:8px; }
    a { color:inherit; }
    @media(max-width:520px) { main { padding:18px 10px 14px; } .legend { gap:10px 14px; } }

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('query-data').textContent);
  const root = document.querySelector('main'), plot = document.getElementById('plot');
  const tooltip = document.querySelector('.tooltip');
  const symbols = new Map([[32,d3.symbolCircle],[64,d3.symbolSquare],[128,d3.symbolTriangle],[256,d3.symbolDiamond]]);
  const symbol = d => d3.symbol().type(symbols.get(d.num_shards)).size(46)();
  document.getElementById('count').textContent = `${data.length} queries · 1B rows`;
  for (const [shards, type] of symbols) {
    const item = d3.select('.legend').append('span');
    item.append('svg').attr('viewBox','-8 -8 16 16').attr('aria-hidden','true')
      .append('path').attr('d',d3.symbol().type(type).size(46)()).attr('fill','var(--bg)').attr('stroke','var(--fg)');
    item.append('span').text(`${shards} shards`);
  }
  function draw() {
    plot.replaceChildren(); tooltip.dataset.visible = 'false';
    const width = Math.floor(plot.getBoundingClientRect().width), height = width < 520 ? 320 : 400;
    const m = {left:62,right:20,top:12,bottom:58};
    const w = width-m.left-m.right, h = height-m.top-m.bottom;
    const x = d3.scaleLinear().domain([0,100]).range([7,w-7]);
    const y = d3.scaleLinear().domain([0,d3.max(data,d=>d.client_elapsed_s)*1.06]).nice().range([h-7,7]);
    const svg = d3.select(plot).append('svg').attr('viewBox',`0 0 ${width} ${height}`)
      .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
    svg.append('title').attr('id','chart-title').text('Query latency by cache hit ratio and shard count');
    svg.append('desc').attr('id','chart-desc').text(`${data.length} individual successful queries. Cache hit ratio runs from 0 to 100 percent horizontally; end-to-end latency in seconds vertically. Circles: 32 shards; squares: 64; triangles: 128; diamonds: 256. All observations can be downloaded below.`);
    const chart=svg.append('g').attr('transform',`translate(${m.left},${m.top})`);
    const ticks=width<520?[0,50,100]:[0,20,40,60,80,100];
    chart.append('g').attr('class','grid').attr('transform',`translate(0,${h})`).call(d3.axisBottom(x).tickValues(ticks).tickSize(-h).tickFormat(''));
    chart.append('g').attr('class','grid').call(d3.axisLeft(y).ticks(5).tickSize(-w).tickFormat(''));
    chart.append('rect').attr('width',w).attr('height',h).attr('fill','none').attr('stroke','var(--line)');
    chart.append('g').attr('transform',`translate(0,${h})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d=>`${d}%`).tickSizeOuter(0));
    chart.append('g').call(d3.axisLeft(y).ticks(5).tickSizeOuter(0));
    svg.append('text').attr('x',m.left+w/2).attr('y',height-12).attr('text-anchor','middle').text('cache hit ratio [ % ]');
    svg.append('text').attr('transform','rotate(-90)').attr('x',-(m.top+h/2)).attr('y',16).attr('text-anchor','middle').text('query time [ seconds ]');
    chart.selectAll('.point').data(data).join('path').attr('class','point').attr('d',symbol)
      .attr('transform',d=>`translate(${x(d.cache_hit_ratio*100)},${y(d.client_elapsed_s)})`);
    const highlight=chart.append('path').attr('fill','var(--bg)').attr('stroke','var(--fg)').attr('stroke-width',2.5).style('display','none').attr('pointer-events','none');
    function show(event) {
      const [px,py]=d3.pointer(event);
      const d=d3.least(data,d=>Math.hypot(x(d.cache_hit_ratio*100)-px,y(d.client_elapsed_s)-py));
      highlight.attr('d',symbol(d)).attr('transform',`translate(${x(d.cache_hit_ratio*100)},${y(d.client_elapsed_s)})`).style('display',null);
      tooltip.replaceChildren();
      const lines=[`${d.num_shards} shards · ${d.cache_temperature}`,`cache hits: ${(d.cache_hit_ratio*100).toFixed(2)}%`,`client time: ${d.client_elapsed_s.toFixed(3)} s`,`server time: ${(d.server_total_ms/1000).toFixed(3)} s`,d.started_at_utc ? `${d.started_at_utc.slice(0,19).replace('T',' ')} UTC` : 'timestamp not recorded'];
      for(const line of lines) { const el=document.createElement('div'); el.textContent=line; tooltip.append(el); }
      tooltip.dataset.visible='true';
      const rootBox=root.getBoundingClientRect(), plotBox=plot.getBoundingClientRect();
      const tx=m.left+x(d.cache_hit_ratio*100)+plotBox.left-rootBox.left;
      const ty=m.top+y(d.client_elapsed_s)+plotBox.top-rootBox.top;
      const tw=tooltip.offsetWidth, th=tooltip.offsetHeight;
      tooltip.style.left=`${Math.max(6,Math.min(tx+14,rootBox.width-tw-6))}px`;
      tooltip.style.top=`${Math.max(6,Math.min(ty+14,rootBox.height-th-6))}px`;
    }
    chart.append('rect').attr('data-chart-hit','').attr('width',w).attr('height',h).attr('fill','transparent').style('cursor','crosshair')
      .on('pointermove',show).on('pointerdown',show).on('pointerleave',()=>{tooltip.dataset.visible='false';highlight.style('display','none');});
  }
  new ResizeObserver(draw).observe(plot);
  try { if(window.parent!==window) new MutationObserver(syncTheme).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']}); } catch (_) {}
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme);
})();
</script>
