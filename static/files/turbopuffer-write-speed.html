<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turbopuffer write speed by chunk size</title>
  <script>
    (() => {
      function resolveTheme() {
        try {
          const parentTheme = window.parent.document.documentElement.dataset.theme;
          if (parentTheme === "light" || parentTheme === "dark") return parentTheme;
        } catch (error) {}
        try {
          const storedTheme = localStorage.getItem("theme");
          if (storedTheme === "light" || storedTheme === "dark") return storedTheme;
        } catch (error) {}
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = resolveTheme();
      window.syncChartTheme = () => {
        document.documentElement.dataset.theme = resolveTheme();
      };
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --tp-bg: #ffffff;
      --tp-fg: #333333;
      --tp-muted: #6a737d;
      --tp-grid: #eaecef;
      --tp-ghost: #8c959f;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --tp-bg: #0d1117;
      --tp-fg: #c9d1d9;
      --tp-muted: #8b949e;
      --tp-grid: #21262d;
      --tp-ghost: #484f58;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-width: 280px; background: var(--tp-bg); }

    body {
      color: var(--tp-fg);
      font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Roboto Mono", monospace;
      font-variant-numeric: tabular-nums;
    }

    #tp-write-speed {
      position: relative;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 18px 18px;
    }

    #tp-write-speed header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 16px;
      margin: 0 0 18px;
    }

    #tp-write-speed .meta {
      color: var(--tp-muted);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    #tp-write-speed h1 {
      margin: 0;
      font-size: clamp(19px, 3.2vw, 31px);
      font-weight: 650;
      letter-spacing: -.04em;
      line-height: 1.05;
    }

    #tp-write-speed .meta { text-align: right; line-height: 1.65; }
    #tp-write-speed .meta strong { color: var(--tp-fg); font-weight: 600; }
    #tp-write-speed figure { margin: 0; }
    #tp-write-speed .plot { width: 100%; min-height: 430px; }
    #tp-write-speed svg { display: block; width: 100%; height: auto; overflow: visible; }
    #tp-write-speed text { fill: var(--tp-fg); font-family: inherit; font-size: 11px; }
    #tp-write-speed .tick text { fill: var(--tp-muted); }
    #tp-write-speed .tick line, #tp-write-speed .domain { stroke: var(--tp-ghost); }
    #tp-write-speed .grid line { stroke: var(--tp-grid); stroke-dasharray: 2 5; }
    #tp-write-speed .grid .domain { display: none; }
    #tp-write-speed .axis-title { fill: var(--tp-fg); font-size: 11px; letter-spacing: .04em; }
    #tp-write-speed .trend { fill: none; stroke: var(--tp-fg); stroke-width: 1.3; stroke-dasharray: 7 5; }
    #tp-write-speed .point { fill: var(--tp-fg); opacity: .32; shape-rendering: crispEdges; }
    #tp-write-speed .hover-point { fill: var(--tp-bg); stroke: var(--tp-fg); stroke-width: 2; shape-rendering: crispEdges; pointer-events: none; }
    #tp-write-speed .guide { stroke: var(--tp-ghost); stroke-width: 1; stroke-dasharray: 2 4; pointer-events: none; }
    #tp-write-speed .hit { fill: transparent; cursor: crosshair; }

    #tp-write-speed .tooltip {
      position: absolute;
      z-index: 2;
      display: none;
      min-width: 190px;
      padding: 9px 10px;
      border: 1px solid var(--tp-fg);
      background: var(--tp-bg);
      color: var(--tp-fg);
      pointer-events: none;
      font-size: 11px;
      line-height: 1.55;
      box-shadow: 4px 4px 0 var(--tp-fg);
    }

    #tp-write-speed .tooltip[data-visible="true"] { display: block; }
    #tp-write-speed .tooltip .tooltip-title { margin-bottom: 4px; color: var(--tp-muted); text-transform: uppercase; letter-spacing: .08em; }
    #tp-write-speed .tooltip .row { display: flex; justify-content: space-between; gap: 18px; }
    #tp-write-speed .tooltip .row span:first-child { color: var(--tp-muted); }

    @media (max-width: 520px) {
      #tp-write-speed { padding: 18px 10px 14px; }
      #tp-write-speed header { grid-template-columns: 1fr; gap: 8px; }
      #tp-write-speed .meta { text-align: left; }
      #tp-write-speed .meta span + span::before { content: " · "; }
    }
  </style>

          .attr("shape-rendering", "crispEdges");

        chart.append("g")
          .attr("transform", `translate(0,${innerHeight})`)
          .call(d3.axisBottom(x).ticks(xTicks).tickFormat(formatTick).tickSizeOuter(0));
        chart.append("g")
          .call(d3.axisLeft(y).ticks(yTicks).tickFormat(formatTick).tickSizeOuter(0));

        svg.append("text")
          .attr("class", "axis-title")
          .attr("data-axis", "x")
          .attr("x", margin.left + innerWidth / 2)
          .attr("y", height - 8)
          .attr("text-anchor", "middle")
          .text("chunk size [ rows ]");
        svg.append("text")
          .attr("class", "axis-title")
          .attr("data-axis", "y")
          .attr("transform", "rotate(-90)")
          .attr("x", -(margin.top + innerHeight / 2))
          .attr("y", 14)
          .attr("text-anchor", "middle")
          .text("write speed [ rows / second ]");

        const trendDomain = x.domain();
        chart.append("path")
          .datum(trendDomain.map(chunkSize => [chunkSize, intercept + slope * chunkSize]))
          .attr("class", "trend")
          .attr("d", d3.line().x(d => x(d[0])).y(d => y(d[1])));

        chart.append("g")
          .selectAll("rect")
          .data(data)
          .join("rect")
          .attr("class", "point")
          .attr("x", d => x(d.chunkSize) - 1.5)
          .attr("y", d => y(d.speed) - 1.5)
          .attr("width", 3)
          .attr("height", 3);

        const guideX = chart.append("line").attr("class", "guide").style("display", "none");
        const guideY = chart.append("line").attr("class", "guide").style("display", "none");
        const hoverPoint = chart.append("rect")
          .attr("class", "hover-point")
          .attr("width", 9)
          .attr("height", 9)
          .style("display", "none");

        function hideTooltip() {
          tooltip.dataset.visible = "false";
          guideX.style("display", "none");
          guideY.style("display", "none");
          hoverPoint.style("display", "none");
        }

        chart.append("rect")
          .attr("class", "hit")
          .attr("data-chart-hit", "")
          .attr("width", innerWidth)
          .attr("height", innerHeight)
          .on("pointerleave", hideTooltip)
          .on("pointermove", event => {
            const [pointerX, pointerY] = d3.pointer(event);
            const nearest = d3.least(data, d => Math.hypot(x(d.chunkSize) - pointerX, y(d.speed) - pointerY));
            const pointX = x(nearest.chunkSize);
            const pointY = y(nearest.speed);

            guideX
              .style("display", null)
              .attr("x1", pointX).attr("x2", pointX)
              .attr("y1", 0).attr("y2", innerHeight);
            guideY
              .style("display", null)
              .attr("x1", 0).attr("x2", innerWidth)
              .attr("y1", pointY).attr("y2", pointY);
            hoverPoint
              .style("display", null)
              .attr("x", pointX - 4.5)
              .attr("y", pointY - 4.5);

            tooltip.innerHTML = `
              <div class="tooltip-title">batch ${formatInteger(nearest.batch)}</div>
              <div class="row"><span>chunk size</span><strong>${formatInteger(nearest.chunkSize)}</strong></div>
              <div class="row"><span>server speed</span><strong>${formatSpeed(nearest.speed)}</strong></div>
              <div class="row"><span>server time</span><strong>${formatInteger(nearest.serverMs)} ms</strong></div>
            `;
            tooltip.dataset.visible = "true";

            const rootBox = root.getBoundingClientRect();
            const plotBox = plot.getBoundingClientRect();
            const tooltipBox = tooltip.getBoundingClientRect();
            const pageX = plotBox.left - rootBox.left + margin.left + pointX;
            const pageY = plotBox.top - rootBox.top + margin.top + pointY;
            const left = pageX + tooltipBox.width + 26 > rootBox.width ? pageX - tooltipBox.width - 14 : pageX + 14;
            const top = Math.max(4, Math.min(pageY - tooltipBox.height / 2, rootBox.height - tooltipBox.height - 4));
            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
          });
      }

      let resizeFrame;
      new ResizeObserver(() => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(draw);
      }).observe(plot);

      try {
        if (window.parent !== window) {
          new MutationObserver(window.syncChartTheme).observe(
            window.parent.document.documentElement,
            { attributes: true, attributeFilter: ["data-theme"] },
          );
        } else {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", window.syncChartTheme);
        }
      } catch (error) {}
    })();
  </script>
</body>
</html>
